{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}{{ block.super }}
<script>
  /* Apply the saved palette before first paint (no flash of the default colours). */
  try { var p = localStorage.getItem("robohub-admin-palette"); if (p) document.documentElement.setAttribute("data-palette", p); } catch (e) {}
</script>
{% endblock %}

{% block userlinks %}
  <label class="rh-palette"><span class="rh-swatch" aria-hidden="true"></span>
    <select id="rh-palette" aria-label="Colour theme">
      {% for value, label in palettes %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
    </select>
  </label>
  {{ block.super }}
  <script src="{% static 'admin/js/robohub-palette.js' %}?v={{ theme_version }}" defer></script>
{% endblock %}

{% block extrastyle %}{{ block.super }}
<link rel="stylesheet" href="{% static 'admin/css/robohub-theme.css' %}?v={{ theme_version }}">
{% include "admin/_form_grid.html" %}
<style>
  /* Sidebar: a section heading per group, one link per model, the current page highlighted. */
  #nav-sidebar { padding-top: 8px; }  /* keep Django's width: the content offset (299px) is computed from it */
  #nav-sidebar .rh-home { display: block; margin: 4px 12px 10px; padding: 9px 12px; border-radius: 8px; font-weight: 600; text-decoration: none; color: var(--body-fg); }
  #nav-sidebar .rh-home:hover, #nav-sidebar .rh-home.current { background: var(--darkened-bg); }
  #nav-sidebar .module tr, #nav-sidebar .module th { background: none; }
  #nav-sidebar .module { margin: 0 0 6px; }
  #nav-sidebar .module table { width: 100%; }
  #nav-sidebar .module caption { background: none; color: var(--body-quiet-color); padding: 10px 18px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #nav-sidebar .module caption a.section, #nav-sidebar .module.current-app caption a.section { color: var(--body-quiet-color); pointer-events: none; text-decoration: none; }
  #nav-sidebar .module th { border: 0; padding: 0; width: 100%; }
  #nav-sidebar .module th a { display: block; padding: 7px 18px 7px 22px; border-radius: 0; color: var(--body-fg); }
  #nav-sidebar .module td { display: none; }
  #nav-sidebar .module tr:hover th a { background: var(--darkened-bg); }
  #nav-sidebar .module tr.current-model th a { background: var(--darkened-bg); font-weight: 600; border-left: 3px solid var(--primary); padding-left: 19px; }
</style>
{% endblock %}
