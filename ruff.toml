line-length = 110
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["DJ001"]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"config/settings/*" = ["F403", "F405"]
"apps/*/seed_data.py" = ["E501"]  # sample content, kept as readable long strings
